name: JB-FAD03B four-mode transaction pinning

on:
  push:
    branches: [research/jb-fad03-four-mode-pinning]
  pull_request:
    paths:
      - "scripts/jb_fad03_pinning.py"
      - "tests/test_jb_fad03_pinning.py"
      - ".github/workflows/jb-fad03-pinning.yml"
      - "docs/JB-FAD03B.md"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography>=44,<47"
      - name: Check all four pin modes, staged independence and nonce
        run: python -m unittest discover -s tests -p "test_jb_fad03_pinning.py" -v
      - name: Emit pinned transaction and four ECDSA transcripts
        run: python scripts/jb_fad03_pinning.py --output /tmp/jb-fad03b-offline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jb-fad03b-offline
          path: /tmp/jb-fad03b-offline.json
          if-no-files-found: warn

  native-regtest:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography>=44,<47"
      - name: Fetch SHA256-pinned Bitcoin Core 30.2
        run: |
          curl -fsSL --retry 3 -o /tmp/bitcoin-core.tar.gz https://bitcoincore.org/bin/bitcoin-core-30.2/bitcoin-30.2-x86_64-linux-gnu.tar.gz
          echo "6aa7bb4feb699c4c6262dd23e4004191f6df7f373b5d5978b5bcdd4bb72f75d8  /tmp/bitcoin-core.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bitcoin-core.tar.gz -C /tmp
          echo "/tmp/bitcoin-30.2/bin" >> "$GITHUB_PATH"
      - name: Start isolated regtest
        run: |
          mkdir -p "$RUNNER_TEMP/jb-fad03b-datadir"
          /tmp/bitcoin-30.2/bin/bitcoind -datadir="$RUNNER_TEMP/jb-fad03b-datadir" -regtest -daemon -server -rpcuser=user -rpcpassword=pass -fallbackfee=0.0001
          for i in $(seq 1 60); do
            if /tmp/bitcoin-30.2/bin/bitcoin-cli -datadir="$RUNNER_TEMP/jb-fad03b-datadir" -regtest -rpcuser=user -rpcpassword=pass getblockchaininfo >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "Bitcoin Core regtest startup failed" >&2
          exit 1
      - name: Mine pinned spend and reject changed payout
        run: |
          python scripts/jb_fad03_pinning.py --live-regtest \
            --output /tmp/jb-fad03b-native.json > /tmp/jb-fad03b-native-summary.txt
          cat /tmp/jb-fad03b-native-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jb-fad03b-native
          path: |
            /tmp/jb-fad03b-native.json
            /tmp/jb-fad03b-native-summary.txt
          if-no-files-found: warn
      - name: Stop regtest
        if: always()
        run: /tmp/bitcoin-30.2/bin/bitcoin-cli -datadir="$RUNNER_TEMP/jb-fad03b-datadir" -regtest -rpcuser=user -rpcpassword=pass stop || true
